plugins {
    alias(libs.plugins.android.application)

}

android {
    namespace 'com.btech.konnectchatirc'
    compileSdk 35


    defaultConfig {
        applicationId "com.btech.konnectchatirc"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "10.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.okhttp
    implementation libs.json
    implementation libs.glide
    annotationProcessor libs.compiler
    implementation libs.slf4j.android
    implementation libs.retrofit
    // implementation libs.pircbotx.v231
    implementation(libs.pircbotx) {
        // Exclude guava to avoid version conflicts
        exclude group: 'com.google.guava', module: 'guava'
    }

    // Include the Guava version compatible with PircBotX
    implementation(libs.guava.v210)

    configurations.all {
         exclude group: 'com.google.guava', module: 'listenablefuture'
    }


}

